<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EduAccess - Live Captions</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin-bottom: 8px;
            font-size: 32px;
        }

        .header p {
            color: #666;
            font-size: 17px;
        }

        .status {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin: 20px;
        }

        .live {
            color: #dc3545;
        }

        .stopped {
            color: #555;
        }

        .caption-box {
            background: white;
            border-radius: 15px;
            padding: 35px;
            min-height: 350px;

            box-shadow: 0 4px 20px rgba(0,0,0,0.08);

            margin-bottom: 25px;
        }

        .section-title {
            font-size: 15px;
            font-weight: bold;
            color: #777;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        #finalText {
            font-size: 25px;
            line-height: 1.7;
            color: #222;
        }

        #interim {
            font-size: 25px;
            line-height: 1.7;
            color: #888;
            font-style: italic;
        }

        .buttons {
            text-align: center;
            margin: 20px 0;
        }

        button {
            padding: 14px 22px;
            margin: 5px;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        #startBtn {
            background: #28a745;
            color: white;
        }

        #stopBtn {
            background: #dc3545;
            color: white;
        }

        #clearBtn {
            background: #555;
            color: white;
        }

        #downloadBtn {
            background: #2563eb;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        .info {
            background: #eaf2ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            color: #333;
        }

    </style>
</head>


<body>

<div class="container">

    <div class="header">

        <h1>🎓 EduAccess</h1>

        <h2>🎙️ Live Lecture Captions</h2>

        <p>
            Real-time speech-to-text for accessible learning
        </p>

    </div>


    <div class="status stopped" id="status">

        ⚪ Lecture Not Started

    </div>


    <div class="caption-box">

        <div class="section-title">
            Live Transcript
        </div>

        <!-- Permanent transcript -->
        <div id="finalText"></div>

        <!-- Currently spoken words -->
        <div id="interim"></div>

    </div>


    <div class="buttons">

        <button id="startBtn">
            🎙️ Start Lecture
        </button>

        <button id="stopBtn">
            ⏹️ Stop Lecture
        </button>

        <button id="clearBtn">
            🗑️ Clear
        </button>

        <button id="downloadBtn">
            💾 Download Transcript
        </button>

    </div>


    <div class="info">

        💡 <b>How it works:</b>
        Press <b>Start Lecture</b> once.
        EduAccess will continuously convert the lecturer's
        speech into live captions.
        Press <b>Stop Lecture</b> when the lecture ends.

    </div>

</div>


<script>

    // --------------------------------
    // CHECK BROWSER SUPPORT
    // --------------------------------

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        alert(
            "Speech Recognition is not supported. " +
            "Please use Google Chrome."
        );

    } else {

        const recognition = new SpeechRecognition();

        recognition.continuous = true;

        recognition.interimResults = true;

        recognition.lang = "en-US";


        // --------------------------------
        // ELEMENTS
        // --------------------------------

        const startBtn =
            document.getElementById("startBtn");

        const stopBtn =
            document.getElementById("stopBtn");

        const clearBtn =
            document.getElementById("clearBtn");

        const downloadBtn =
            document.getElementById("downloadBtn");

        const finalText =
            document.getElementById("finalText");

        const interim =
            document.getElementById("interim");

        const status =
            document.getElementById("status");


        let isRecording = false;


        // --------------------------------
        // START
        // --------------------------------

        startBtn.onclick = function () {

            if (isRecording)
                return;

            isRecording = true;

            recognition.start();

            status.innerHTML =
                "🔴 Listening to Lecture...";

            status.className =
                "status live";

        };


        // --------------------------------
        // STOP
        // --------------------------------

        stopBtn.onclick = function () {

            isRecording = false;

            recognition.stop();

            interim.innerHTML = "";

            status.innerHTML =
                "⚪ Lecture Stopped";

            status.className =
                "status stopped";

        };


        // --------------------------------
        // SPEECH RESULT
        // --------------------------------

        recognition.onresult = function(event) {

            let currentInterim = "";


            for (
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ) {

                const transcript =
                    event.results[i][0].transcript;


                if (event.results[i].isFinal) {

                    finalText.innerHTML +=
                        transcript + " ";

                } else {

                    currentInterim +=
                        transcript;

                }

            }


            interim.innerHTML =
                currentInterim;


            // Automatically scroll
            // to latest caption

            window.scrollTo(
                0,
                document.body.scrollHeight
            );

        };


        // --------------------------------
        // ERROR
        // --------------------------------

        recognition.onerror = function(event) {

            console.log(
                "Speech recognition error:",
                event.error
            );


            if (event.error === "not-allowed") {

                status.innerHTML =
                    "⚠️ Microphone permission denied";

            } else {

                status.innerHTML =
                    "⚠️ Error: " + event.error;

            }

        };


        // --------------------------------
        // RESTART AFTER INTERRUPTION
        // --------------------------------

        recognition.onend = function() {

            if (isRecording) {

                try {

                    recognition.start();

                } catch (error) {

                    console.log(error);

                }

            }

        };


        // --------------------------------
        // CLEAR
        // --------------------------------

        clearBtn.onclick = function() {

            finalText.innerHTML = "";

            interim.innerHTML = "";

        };


        // --------------------------------
        // DOWNLOAD TRANSCRIPT
        // --------------------------------

        downloadBtn.onclick = function() {

            const transcript =
                finalText.innerText.trim();


            if (transcript === "") {

                alert(
                    "There is no transcript to download yet."
                );

                return;

            }


            const blob =
                new Blob(
                    [transcript],
                    { type: "text/plain" }
                );


            const url =
                URL.createObjectURL(blob);


            const link =
                document.createElement("a");


            link.href = url;

            link.download =
                "EduAccess_Lecture_Transcript.txt";


            link.click();


            URL.revokeObjectURL(url);

        };

    }

</script>

</body>

</html>
